  <script>
    const COURTS = ['場地1', '場地2', '場地3'];
    const ALL_TIME_SLOTS = [
      '07:00 ~ 08:00', '08:00 ~ 09:00', '09:00 ~ 10:00', '10:00 ~ 11:00',
      '11:00 ~ 12:00', '12:00 ~ 13:00', '13:00 ~ 14:00', '14:00 ~ 15:00',
      '15:00 ~ 16:00', '16:00 ~ 17:00', '17:00 ~ 18:00', '18:00 ~ 19:00',
      '19:00 ~ 20:00', '20:00 ~ 21:00'
    ];

    let currentDate = new Date().toISOString().split('T')[0];
    let selectedCells = new Set(); 
    let bookings = {}; 
    let currentEditKey = null; 
    let currentBookingType = 'personal';
    let isMobileView = localStorage.getItem('badminton_view_mode') === 'mobile';
    let isAdminLoggedIn = false;
    let unsubscribe = null; 

    let coachList = JSON.parse(localStorage.getItem('badminton_coach_list')) || [
      '彭教練', '盧教練', '陳教練', '林教練', '黃教練'
    ];

    function setupFirestoreListener() {
      if (!window.db) {
        loadLocalStorageFallback();
        renderAll();
        return;
      }
      if (unsubscribe) unsubscribe(); 

      if (!bookings[currentDate]) {
        bookings[currentDate] = { eventTitle: '', nightOnly: false, slots: {} };
      }

      const docRef = window.fsDoc(window.db, "bookings", currentDate);
      unsubscribe = window.fsOnSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          bookings[currentDate] = docSnap.data();
        } else {

        renderAll();
      });

    function populateStatsTargetSelect() {
      const type = statsTypeSelect.value;
      statsTargetSelect.innerHTML = '';

      if (type === 'coach') {
        coachList.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          statsTargetSelect.appendChild(opt);
        });
      } else {
        // 蒐集所有預約過學員的名稱
        const studentSet = new Set();
        Object.keys(bookings).forEach(date => {
          const slots = bookings[date].slots || {};
          Object.values(slots).forEach(slot => {
            if (slot.type === 'personal' && slot.student) {
              studentSet.add(slot.student);
            }
          });
        });
        if (studentSet.size === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.innerText = '-- 無學員紀錄 --';
          statsTargetSelect.appendChild(opt);
        } else {
          studentSet.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = s;
            statsTargetSelect.appendChild(opt);
          });
        }
      }
    }

    function renderStatsData() {
      const type = statsTypeSelect.value;
      const target = statsTargetSelect.value;
      const range = statsRangeSelect.value;

      statsTargetLabel.innerText = target || '(無選項)';
      statsTableBody.innerHTML = '';

      if (!target) {
        statsTotalHours.innerText = '0';
        statsTotalHoursCalc.innerText = '0';
        statsTableBody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">目前無資料</td></tr>';
        return;
      }

      let matchedSlots = [];

      const targetDates = (range === 'current') ? [currentDate] : Object.keys(bookings);

      targetDates.forEach(dStr => {
        const daySlots = (bookings[dStr] && bookings[dStr].slots) || {};
        Object.keys(daySlots).forEach(sKey => {
          const slot = daySlots[sKey];
          if (slot.type === 'personal') {
            const isMatch = (type === 'coach' && slot.coach === target) || (type === 'student' && slot.student === target);
            if (isMatch) {
              const [cIdx, tIdx] = sKey.split('_').map(Number);
              matchedSlots.push({
                date: dStr,
                court: COURTS[cIdx],
                time: ALL_TIME_SLOTS[tIdx],
                student: slot.student,
                coach: slot.coach || '無',
                timeNote: slot.timeNote || '-'
              });
            }
          }
        });
      });

      // 按日期升冪排序
      matchedSlots.sort((a, b) => a.date.localeCompare(b.date));

      statsTotalHours.innerText = matchedSlots.length;
      statsTotalHoursCalc.innerText = matchedSlots.length;

      if (matchedSlots.length === 0) {
        statsTableBody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">查無相關預約個練紀錄</td></tr>';
      } else {
        matchedSlots.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-amber-50/50 transition';
          tr.innerHTML = `
            <td class="p-2 border-r font-mono">${item.date}</td>
            <td class="p-2 border-r font-bold">${item.court}</td>
            <td class="p-2 border-r font-mono">${item.time}</td>
            <td class="p-2 border-r font-bold text-emerald-900">${item.student}</td>
            <td class="p-2 border-r text-indigo-900">${item.coach}</td>
            <td class="p-2 text-slate-500 font-mono">${item.timeNote}</td>
          `;
          statsTableBody.appendChild(tr);
        });
      }
    }

          { time: '19:00 ~ 20:00', originalIdx: 12 },

                const coachStr = booking.coach ? `<span class="text-emerald-800 font-normal ml-1">(${booking.coach})</span>` : '';

                    <span class="text-xs font-bold text-emerald-900">${booking.student}</span>${coachStr}

            const slotKey = `${cIdx}_${originalIdx}`;
            const isSelected = selectedCells.has(slotKey);
            const booking = dayData.slots ? dayData.slots[slotKey] : null;

            let cellClass = 'bg-white hover:bg-slate-100 cursor-pointer';
            let contentHtml = '';

            if (booking) {
              if (booking.type === 'club') {
                cellClass = 'bg-amber-100/90 hover:bg-amber-200/90 border-amber-300 text-amber-900 font-bold';
                contentHtml = `<div class="text-[11px]">社團</div>`;
              } else {
                cellClass = 'bg-emerald-100/90 hover:bg-emerald-200/90 border-emerald-300 text-emerald-900';
                const coachStr = booking.coach ? `<span class="text-xs block opacity-90 text-emerald-800 font-normal">(${booking.coach})</span>` : '';
                contentHtml = `
                  <div class="font-bold text-xs leading-tight truncate px-0.5">${booking.student}</div>
                  ${coachStr}
                  ${booking.timeNote ? `<div class="text-[10px] text-emerald-800 font-mono scale-95 leading-none mt-0.5">${booking.timeNote}</div>` : ''}
                `;
              }
            }

            if (isSelected) {
              cellClass += ' ring-2 ring-emerald-600 ring-inset bg-emerald-200/80';
            }

            rowHtml += `
              <div class="flex-1 min-w-[65px] p-1 border-r border-slate-200 flex flex-col justify-center items-center text-center transition relative ${cellClass}" data-key="${slotKey}">
                ${contentHtml}
                ${isSelected ? `<i class="fa-solid fa-circle-check absolute top-0.5 right-0.5 text-emerald-700 text-[10px]"></i>` : ''}
              </div>
            `;
          });

          row.innerHTML = rowHtml;
          gridTable.appendChild(row);
        });
      }

      gridTable.querySelectorAll('[data-key]').forEach(cell => {
        cell.addEventListener('click', () => {
          const key = cell.dataset.key;
          const daySlots = (bookings[currentDate] && bookings[currentDate].slots) || {};
          
          if (daySlots[key]) {
            openEditModal(key, daySlots[key]);
          } else {
            if (!isAdminLoggedIn) {
              alert('非管理者僅供檢視，請先登入管理員身分進行預約操作！');
              return;
            }
            if (selectedCells.has(key)) {
              selectedCells.delete(key);
            } else {
              selectedCells.add(key);
            }
            updateActionBar();
            renderGrid();
          }
        });
      });
    }

    function updateActionBar() {
      if (isAdminLoggedIn && selectedCells.size > 0) {
        selectedCountEl.innerText = selectedCells.size;
        actionBar.classList.remove('translate-y-24', 'opacity-0');
      } else {
        actionBar.classList.add('translate-y-24', 'opacity-0');
      }
    }

    function renderAll() {
      datePicker.value = currentDate;
      updateAdminUIState();
      updateViewModeUI();
      renderDateTabs();
      setupFirestoreListener();
      updateActionBar();
    }

    function openBatchModal() {
      if (!isAdminLoggedIn) return;
      currentEditKey = null;
      deleteBookingBtn.classList.add('hidden');
      saveBookingBtn.classList.remove('hidden');
      document.getElementById('modal-title').innerText = '新增批次預約';
      inputStudent.value = '';
      inputStudent.removeAttribute('disabled');
      selectCoach.removeAttribute('disabled');
      inputTimeNote.removeAttribute('disabled');
      typePersonalBtn.removeAttribute('disabled');
      typeClubBtn.removeAttribute('disabled');
      
      renderCoachSelect('');
      inputTimeNote.value = '';
      setBookingType('personal');

      let summaryHtml = '<div class="font-bold mb-1">已選擇以下時段格：</div>';
      selectedCells.forEach(key => {
        const [cIdx, tIdx] = key.split('_').map(Number);
        summaryHtml += `<div>• ${COURTS[cIdx]} - ${ALL_TIME_SLOTS[tIdx]}</div>`;
      });
      modalSlotsSummary.innerHTML = summaryHtml;
      bookingModal.classList.remove('hidden');
    }

    function openEditModal(key, data) {
      currentEditKey = key;
      const [cIdx, tIdx] = key.split('_').map(Number);
      modalSlotsSummary.innerHTML = `<div class="font-bold">${COURTS[cIdx]} - ${ALL_TIME_SLOTS[tIdx]}</div>`;
      setBookingType(data.type || 'personal');
      
      inputStudent.value = data.student || '';
      renderCoachSelect(data.coach || '');
      inputTimeNote.value = data.timeNote || '';

      if (isAdminLoggedIn) {
        document.getElementById('modal-title').innerText = '編輯/取消預約';
        deleteBookingBtn.classList.remove('hidden');
        saveBookingBtn.classList.remove('hidden');
        cancelModalAction.innerText = '取消';
        
        inputStudent.removeAttribute('disabled');
        selectCoach.removeAttribute('disabled');
        inputTimeNote.removeAttribute('disabled');
        typePersonalBtn.removeAttribute('disabled');
        typeClubBtn.removeAttribute('disabled');
      } else {
        document.getElementById('modal-title').innerText = '預約詳情 (唯讀)';
        deleteBookingBtn.classList.add('hidden');
        saveBookingBtn.classList.add('hidden');
        cancelModalAction.innerText = '關閉';

        inputStudent.setAttribute('disabled', 'disabled');
        selectCoach.setAttribute('disabled', 'disabled');
        inputTimeNote.setAttribute('disabled', 'disabled');
        typePersonalBtn.setAttribute('disabled', 'disabled');
        typeClubBtn.setAttribute('disabled', 'disabled');
      }

      bookingModal.classList.remove('hidden');
    }

    function setBookingType(type) {
      currentBookingType = type;
      if (type === 'personal') {
        typePersonalBtn.className = 'py-1.5 px-3 border border-emerald-600 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium text-center transition';
        typeClubBtn.className = 'py-1.5 px-3 border border-slate-300 bg-white text-slate-600 rounded-lg text-xs font-medium text-center transition hover:bg-slate-50';
        personalFields.classList.remove('hidden');
        clubFields.classList.add('hidden');
      } else {
        typeClubBtn.className = 'py-1.5 px-3 border border-amber-600 bg-amber-50 text-amber-700 rounded-lg text-xs font-medium text-center transition';
        typePersonalBtn.className = 'py-1.5 px-3 border border-slate-300 bg-white text-slate-600 rounded-lg text-xs font-medium text-center transition hover:bg-slate-50';
        clubFields.classList.remove('hidden');
        personalFields.classList.add('hidden');
      }
    }

    saveBookingBtn.addEventListener('click', () => {
      if (!isAdminLoggedIn) return;
      if (!bookings[currentDate]) {
        bookings[currentDate] = { eventTitle: dayEventTitleInput.value, nightOnly: false, slots: {} };
      }
      const bookingPayload = {
        type: currentBookingType,
        student: currentBookingType === 'personal' ? inputStudent.value.trim() : '社團',
        coach: currentBookingType === 'personal' ? selectCoach.value.trim() : '',
        timeNote: currentBookingType === 'personal' ? inputTimeNote.value.trim() : ''
      };
      if (currentBookingType === 'personal' && !bookingPayload.student) {
        alert('請填寫學員姓名！');
        return;
      }
      if (currentEditKey) {
        bookings[currentDate].slots[currentEditKey] = bookingPayload;
      } else {
        selectedCells.forEach(key => {
          bookings[currentDate].slots[key] = bookingPayload;
        });
        selectedCells.clear();
      }
      saveData();
      bookingModal.classList.add('hidden');
      renderGrid();
      updateActionBar();
    });

    deleteBookingBtn.addEventListener('click', () => {
      if (!isAdminLoggedIn) return;
      if (currentEditKey && bookings[currentDate] && bookings[currentDate].slots) {
        delete bookings[currentDate].slots[currentEditKey];
        saveData();
        bookingModal.classList.add('hidden');
        renderGrid();
      }
    });

    datePicker.addEventListener('change', (e) => {
      currentDate = e.target.value;
      selectedCells.clear();
      renderDateTabs();
      setupFirestoreListener();
      updateActionBar();
    });

    prevDayBtn.addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() - 1);
      currentDate = d.toISOString().split('T')[0];
      selectedCells.clear();
      renderDateTabs();
      setupFirestoreListener();
      updateActionBar();
    });

    nextDayBtn.addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + 1);
      currentDate = d.toISOString().split('T')[0];
      selectedCells.clear();
      renderDateTabs();
      setupFirestoreListener();
      updateActionBar();
    });

    todayBtn.addEventListener('click', () => {
      currentDate = new Date().toISOString().split('T')[0];
      selectedCells.clear();
      renderDateTabs();
      setupFirestoreListener();
      updateActionBar();
    });

    clearDayBtn.addEventListener('click', () => {
      if (!isAdminLoggedIn) return;
      if (confirm('確定要清空當日所有的預約紀錄嗎？')) {
        if (bookings[currentDate]) {
          bookings[currentDate].slots = {};
          saveData();
          renderGrid();
        }
      }
    });

    cancelSelectionBtn.addEventListener('click', () => {
      selectedCells.clear();
      renderGrid();
      updateActionBar();
    });

    openBookingModalBtn.addEventListener('click', openBatchModal);
    closeModalBtn.addEventListener('click', () => bookingModal.classList.add('hidden'));
    cancelModalAction.addEventListener('click', () => bookingModal.classList.add('hidden'));
    typePersonalBtn.addEventListener('click', () => { if (isAdminLoggedIn) setBookingType('personal'); });
    typeClubBtn.addEventListener('click', () => { if (isAdminLoggedIn) setBookingType('club'); });

    window.addEventListener('firebase-init', () => { renderAll(); });
    setTimeout(() => {
      if (!window.db) {
        loadLocalStorageFallback();
        renderAll();
      }
    }, 500);
  </script>
</body>
</html>
