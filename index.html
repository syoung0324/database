<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球場個人練習與預約統計系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/firebase-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen h-screen flex flex-col overflow-hidden">

  <!-- 1. 頂部導覽列 -->
  <header class="bg-emerald-800 text-white px-2.5 sm:px-4 py-2 flex flex-wrap items-center justify-between shadow-md shrink-0 gap-2">
    <div class="flex items-center space-x-2 sm:space-x-2.5 min-w-0">
      <div class="bg-emerald-600 p-1.5 rounded-lg flex items-center justify-center shrink-0">
        <i class="fa-solid fa-table text-base sm:text-lg text-emerald-100"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-bold text-xs sm:text-base leading-tight flex flex-wrap items-center gap-1.5">
          <span>羽球場預約統計系統</span>
          <span id="mode-badge" class="text-[10px] bg-emerald-700/80 text-emerald-200 px-1.5 py-0.5 rounded font-normal border border-emerald-600 shrink-0">Excel 模式</span>
          <span id="online-status-badge" class="text-[10px] sm:text-[11px] bg-emerald-950/80 text-lime-300 px-2 py-0.5 rounded-full font-bold border border-lime-400/50 flex items-center gap-1.5 shadow-inner shrink-0" title="目前正在線瀏覽此系統的人數">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-lime-400"></span>
            </span>
            <span>目前線上：<b id="online-user-count" class="font-mono text-white">1</b> 人</span>
          </span>
        </h1>
        <p class="hidden sm:block text-[11px] text-emerald-200">自動適應視窗大小｜Y 軸場地 / X 軸時間段</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-xs">
      <button id="open-public-announcement-btn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold px-2.5 py-1 rounded-lg text-xs transition shadow-sm flex items-center gap-1 shrink-0">
        <i class="fa-solid fa-bullhorn"></i><span>公告 / 教練簡介</span>
      </button>
      <button id="admin-login-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-2.5 py-1 rounded-lg text-xs transition shadow-sm flex items-center gap-1 shrink-0">
        <i class="fa-solid fa-lock" id="admin-lock-icon"></i><span id="admin-btn-text">管理員登入</span>
      </button>
      <button id="toggle-view-mode-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs transition shadow-sm flex items-center gap-1 shrink-0">
        <i id="mode-icon" class="fa-solid fa-mobile-screen-button"></i><span id="mode-text">切換手機模式</span>
      </button>

      <div class="flex items-center bg-emerald-900/60 rounded-lg p-0.5 border border-emerald-700">
        <button id="prev-day-btn" class="px-2 py-1 rounded hover:bg-emerald-700 transition text-emerald-200 hover:text-white" title="前一天">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <input type="date" id="date-picker" class="bg-transparent text-white text-xs px-1 py-0.5 focus:outline-none cursor-pointer font-medium w-24 sm:w-auto">
        <button id="next-day-btn" class="px-2 py-1 rounded hover:bg-emerald-700 transition text-emerald-200 hover:text-white" title="後一天">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <button id="today-btn" class="hidden sm:inline-block bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1 rounded-lg text-xs font-medium transition shadow-sm border border-emerald-600">回到今日</button>
      <button id="clear-day-btn" class="hidden bg-rose-700/80 hover:bg-rose-600 text-white px-2 py-1 rounded-lg text-xs font-medium transition shadow-sm border border-rose-600/50" title="清空當日">
        <i class="fa-solid fa-trash-can"></i><span class="hidden sm:inline ml-1">清空當日</span>
      </button>
    </div>
  </header>

  <!-- 2. 公開公告摘要與倒數計時列 -->
  <div id="public-top-notice-bar" class="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 text-white px-2.5 sm:px-4 py-1.5 border-b border-sky-800/80 flex flex-wrap items-center justify-between gap-2 shrink-0 text-xs shadow">
    <div id="top-announcement-summary" class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer group" title="點擊查看完整公告與教練簡介">
      <span id="top-announcement-sticker" class="text-base sm:text-lg shrink-0 group-hover:scale-110 transition">📢</span>
      <span class="bg-sky-400 text-slate-950 font-black px-1.5 py-0.5 rounded text-[10px] sm:text-xs shrink-0">最新公告</span>
      <span id="top-announcement-text" class="truncate text-sky-100 font-semibold group-hover:text-white transition">歡迎來到羽球場預約統計系統！點擊查看教練團簡介與最新消息。</span>
    </div>
    <div id="top-countdown-box" class="flex items-center gap-1.5 bg-amber-400/15 border border-amber-400/50 px-2.5 py-0.5 rounded-lg shrink-0 ml-auto">
      <i class="fa-solid fa-hourglass-half text-amber-300 animate-pulse"></i>
      <span id="top-countdown-title" class="text-amber-200 font-bold text-[11px] sm:text-xs">活動倒數：</span>
      <span id="top-countdown-timer" class="font-mono font-black text-amber-300 text-xs sm:text-sm tracking-wide">-- 天 -- 時 -- 分 -- 秒</span>
    </div>
  </div>

  <!-- 3. 快速日期分頁 -->
  <nav id="date-tabs-bar" class="bg-slate-200 border-b border-slate-300 px-2 py-1 flex items-center gap-1.5 overflow-x-auto text-xs shrink-0"></nav>

  <!-- 4. 賽事活動備註與管理員工具列 -->
  <div class="bg-indigo-950 text-white px-2.5 sm:px-4 py-1.5 border-b border-indigo-900 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-inner">
    <div class="flex items-center gap-2 flex-1 min-w-[240px]">
      <div class="bg-amber-400 text-slate-950 font-black px-2 py-1 rounded text-[11px] sm:text-sm tracking-wider flex items-center gap-1.5 shrink-0 uppercase shadow">
        <i class="fa-solid fa-trophy"></i><span>今日賽事/活動備註</span>
      </div>
      <div id="marquee-container" class="relative flex-1 max-w-md overflow-hidden bg-indigo-900/80 hover:bg-indigo-900 rounded border border-amber-400/50 h-8 sm:h-9 flex items-center px-2 cursor-pointer" title="點擊進行編輯">
        <input type="text" id="day-event-title" readonly placeholder="點擊設定活動標記 (如：摩亞盃...)" class="w-full bg-transparent text-amber-300 font-extrabold text-sm sm:text-lg px-1 focus:outline-none placeholder-indigo-300/60 tracking-wide cursor-not-allowed">
        <div id="day-event-marquee" class="hidden w-full overflow-hidden text-amber-300 font-extrabold text-sm sm:text-lg tracking-wide select-none absolute inset-0 flex items-center px-2">
          <div id="marquee-text" class="animate-marquee"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 flex-wrap">
      <button id="open-board-manage-btn" class="hidden bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold px-2.5 py-1.5 rounded-lg text-xs transition shadow border border-sky-300 flex items-center gap-1"><i class="fa-solid fa-bullhorn"></i> 公告與倒數設定</button>
      <button id="open-quick-parse-btn" class="hidden bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs transition shadow border border-fuchsia-400 flex items-center gap-1"><i class="fa-solid fa-wand-magic-sparkles"></i> 快速文字預約</button>
      <button id="open-stats-btn" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1.5 rounded-lg text-xs transition shadow border border-amber-400 flex items-center gap-1"><i class="fa-solid fa-chart-pie"></i> 統計報表</button>

      <label id="hide-day-toggle-wrapper" class="hidden items-center gap-1.5 bg-rose-900/80 hover:bg-rose-900 px-2.5 py-1.5 rounded-lg border border-rose-700 text-xs text-rose-100 cursor-pointer select-none transition">
        <input type="checkbox" id="hide-day-checkbox" class="w-4 h-4 accent-rose-600 rounded cursor-pointer">
        <span class="font-bold text-rose-200"><i class="fa-solid fa-eye-slash mr-1"></i>隱藏當日所有預約時段</span>
      </label>
      <label id="night-toggle-wrapper" class="hidden items-center gap-1.5 bg-indigo-900/80 hover:bg-indigo-900 px-2.5 py-1.5 rounded-lg border border-indigo-700 text-xs text-indigo-200 cursor-pointer select-none transition">
        <input type="checkbox" id="night-only-checkbox" class="w-4 h-4 accent-emerald-600 rounded cursor-pointer">
        <span class="font-bold text-amber-300">🌙 僅顯示晚上 (18:00-21:00)</span>
      </label>

      <button id="manage-students-btn" class="hidden bg-teal-700 hover:bg-teal-600 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition shadow border border-teal-500 flex items-center gap-1"><i class="fa-solid fa-graduation-cap"></i> 學員年級總表</button>
      <button id="manage-coaches-btn" class="hidden bg-indigo-700 hover:bg-indigo-600 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition shadow border border-indigo-500 flex items-center gap-1"><i class="fa-solid fa-user-gear"></i> 教練管理</button>

      <div class="hidden xl:flex items-center gap-3 text-[11px] font-medium text-indigo-200 border-l border-indigo-800/80 pl-3">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-100 border border-emerald-400 inline-block"></span> 個練預約</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-100 border border-amber-400 inline-block"></span> 社團包場</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-purple-100 border border-purple-400 inline-block"></span> 其他用途</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-white border border-slate-300 inline-block"></span> 空白可選</span>
      </div>
    </div>
  </div>

  <!-- 5. 場地預約主表格 -->
  <main class="flex-1 overflow-auto grid-scroll p-2 sm:p-3 lg:p-4 pb-20 bg-slate-100 flex flex-col w-full">
    <div id="main-container" class="bg-white rounded-lg shadow-md border border-slate-300 overflow-x-auto flex-1 flex flex-col w-full">
      <div id="grid-table" class="divide-y divide-slate-200 flex-1 flex flex-col w-full min-w-[1420px] lg:min-w-0"></div>
    </div>
  </main>

  <!-- 6. 批次選取浮動列 -->
  <div id="action-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 sm:px-5 py-2.5 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 translate-y-24 opacity-0 z-30 border border-slate-700 w-[92%] max-w-md justify-between sm:justify-start">
    <div class="text-xs shrink-0">已選取 <span id="selected-count" class="font-bold text-amber-400 text-sm">0</span> 格</div>
    <div class="h-4 w-[1px] bg-slate-700 hidden sm:block"></div>
    <button id="open-booking-modal-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow">
      <i class="fa-solid fa-pen-to-square"></i><span>填寫預約資料</span>
    </button>
    <button id="cancel-selection-btn" class="text-xs text-slate-400 hover:text-white px-2 py-1">取消</button>
  </div>

  <!-- 7. 所有 Modal 視窗掛載點（由 js/modals.js 自動注入） -->
  <div id="modals-root"></div>

  <!-- 模組化 JavaScript（modals.js 必須在 state.js 之前載入） -->
  <script src="js/modals.js"></script>
  <script src="js/state.js"></script>
  <script src="js/coaches.js"></script>
  <script src="js/students.js"></script>
  <script src="js/announcement.js"></script>
  <script src="js/quick-parse.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/excel-export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
